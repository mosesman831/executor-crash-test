[project]
name = "executor-crash-test"
version = "0.1.0"
description = "Fault injection for self-hosted agent executors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=3.26,<4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
crashtest = "crashtest.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crashtest"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
